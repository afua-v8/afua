<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập · Công nghệ cao</title>
    <style>
        /* ---------- RESET & NỀN ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a12;
            background-image: radial-gradient(circle at 20% 30%, #1a1040 0%, #05030a 90%);
            transition: background 0.5s;
        }
        /* ---------- CONTAINER ĐĂNG NHẬP ---------- */
        .login-box {
            background: rgba(20, 15, 40, 0.75);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(160, 120, 255, 0.25);
            border-radius: 48px;
            padding: 48px 40px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(100, 60, 255, 0.3), inset 0 0 80px rgba(130, 80, 255, 0.08);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .login-box h1 {
            color: #d4c8ff;
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 30px #7a4aff;
            margin-bottom: 32px;
            text-align: center;
        }
        .login-box label {
            color: #b0a0e0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: block;
            margin-top: 16px;
            margin-bottom: 4px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(10, 8, 20, 0.7);
            border: 1px solid #3a2a6a;
            border-radius: 30px;
            color: #f0ecff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .login-box input:focus {
            border-color: #a77aff;
            box-shadow: 0 0 20px #6a3eff55;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            background: linear-gradient(135deg, #6f3cff, #a14cff);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 6px 24px #5a2ee0aa;
        }
        .login-box button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px #7b4affcc;
        }
        .login-box .error {
            color: #ff7a9e;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            min-height: 24px;
        }

        /* ---------- TRANG CHÍNH (SAU ĐĂNG NHẬP) ---------- */
        .main-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 700px;
            max-width: 94vw;
            background: rgba(18, 10, 40, 0.6);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid #7a4aff66;
            border-radius: 64px;
            padding: 50px 40px 60px;
            box-shadow: 0 0 100px #4f29dd33, inset 0 0 120px #6f3cff22;
            animation: glowPulse 4s infinite alternate;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 60px #4a1fbb44, inset 0 0 60px #4f1fcc22; }
            100% { box-shadow: 0 0 120px #8b5cff88, inset 0 0 120px #7a4aff55; }
        }
        .main-panel h2 {
            color: #e8dcff;
            font-weight: 200;
            font-size: 2.8rem;
            letter-spacing: 6px;
            text-shadow: 0 0 60px #b28aff;
            margin-bottom: 40px;
        }
        .button-group {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-neon {
            padding: 18px 44px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 600;
            background: #1f173a;
            color: #7a6a9a;
            border: 2px solid #3a2a6a;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #00000044;
            letter-spacing: 1px;
            min-width: 150px;
            position: relative;
        }
        .btn-neon.active {
            background: #4a2faa;
            color: #ffffff;
            border-color: #b28aff;
            box-shadow: 0 0 30px #7a4affaa, inset 0 0 20px #c8b0ff66;
        }
        .btn-neon:disabled {
            opacity: 0.35;
            filter: grayscale(0.6);
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-neon:not(:disabled):hover {
            transform: scale(1.05);
        }
        #btnKichHoat {
            background: #1f1238;
            border-color: #5a3a8a;
        }
        #btnKichHoat.active {
            background: #b26aff;
            border-color: #e4ccff;
            box-shadow: 0 0 60px #ae7affee, inset 0 0 40px #f0e4ff;
            animation: kichHoatFlash 0.8s 2;
        }
        @keyframes kichHoatFlash {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); box-shadow: 0 0 100px #c084ff; }
            100% { transform: scale(1); }
        }
        .status-text {
            margin-top: 40px;
            color: #b8a8e0;
            font-size: 0.95rem;
            letter-spacing: 2px;
            background: #0e0822aa;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid #4a2a7a;
        }

        /* ---------- ẨN/HIỆN ---------- */
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeScale 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <!-- ======== FORM ĐĂNG NHẬP ======== -->
    <div id="loginContainer" class="login-box">
        <h1>🔐 AFUA·NET</h1>
        <label>Tên đăng nhập</label>
        <input type="text" id="username" value="afua" placeholder="afua">
        <label>Mật khẩu</label>
        <input type="password" id="password" value="123456" placeholder="••••••••">
        <button id="loginBtn">KẾT NỐI BẢO MẬT</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- ======== TRANG CHÍNH SAU LOGIN ======== -->
    <div id="mainPanel" class="main-panel hidden">
        <h2>⚡ ĐIỀU KHIỂN</h2>
        <div class="button-group">
            <!-- Nút 1: Aimlock -->
            <button id="btnAimlock" class="btn-neon" data-active="false">🎯 AIMLOCK</button>
            <!-- Nút 2: Nhẹ tâm -->
            <button id="btnNheTam" class="btn-neon" data-active="false">🌀 NHẸ TÂM</button>
            <!-- Nút 3: Kích hoạt (disabled mặc định) -->
            <button id="btnKichHoat" class="btn-neon" disabled data-active="false">⚡ KÍCH HOẠT</button>
        </div>
        <div id="statusDisplay" class="status-text">◆ TRẠNG THÁI: CHỜ KÍCH HOẠT</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ----- DOM refs -----
            const loginContainer = document.getElementById('loginContainer');
            const mainPanel = document.getElementById('mainPanel');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            const btnAimlock = document.getElementById('btnAimlock');
            const btnNheTam = document.getElementById('btnNheTam');
            const btnKichHoat = document.getElementById('btnKichHoat');
            const statusDisplay = document.getElementById('statusDisplay');

            // ----- Hằng số đăng nhập -----
            const VALID_USER = 'afua';
            const VALID_PASS = '123456';

            // ----- Trạng thái nút -----
            let aimlockOn = false;
            let nheTamOn = false;
            let kichHoatOn = false;

            // ----- Hàm cập nhật nút 3 và trạng thái -----
            function updateKichHoatState() {
                // Nút 3 chỉ enabled khi cả 2 nút trên đều bật
                const canEnable = aimlockOn && nheTamOn;
                btnKichHoat.disabled = !canEnable;

                // Nếu đang bật mà điều kiện mất → tự động tắt Kích hoạt
                if (kichHoatOn && !canEnable) {
                    kichHoatOn = false;
                    btnKichHoat.dataset.active = 'false';
                    btnKichHoat.classList.remove('active');
                    btnKichHoat.textContent = '⚡ KÍCH HOẠT';
                    statusDisplay.textContent = '◆ TRẠNG THÁI: MẤT HIỆU LỰC (thiếu điều kiện)';
                }

                // Cập nhật text trạng thái nếu đang bật
                if (kichHoatOn && canEnable) {
                    statusDisplay.textContent = '✅ KÍCH HOẠT THÀNH CÔNG — HỆ THỐNG SẴN SÀNG';
                } else if (aimlockOn && nheTamOn) {
                    statusDisplay.textContent = '⏳ SẴN SÀNG KÍCH HOẠT (bấm nút 3)';
                } else {
                    statusDisplay.textContent = '◆ TRẠNG THÁI: CHỜ BẬT AIMLOCK + NHẸ TÂM';
                }
            }

            // ----- Xử lý bật/tắt nút 1 và 2 -----
            function toggleButton(btn, stateVar, labelOn, labelOff) {
                const current = stateVar();
                const newState = !current;
                // Cập nhật biến đóng
                if (btn === btnAimlock) {
                    aimlockOn = newState;
                } else if (btn === btnNheTam) {
                    nheTamOn = newState;
                }
                // Cập nhật giao diện
                btn.dataset.active = newState ? 'true' : 'false';
                btn.classList.toggle('active', newState);
                btn.textContent = newState ? labelOn : labelOff;
                // Cập nhật nút 3
                updateKichHoatState();
            }

            // Gắn sự kiện cho nút 1
            btnAimlock.addEventListener('click', function() {
                toggleButton(this,
                    () => aimlockOn,
                    '🎯 AIMLOCK ✓', '🎯 AIMLOCK'
                );
            });

            // Gắn sự kiện cho nút 2
            btnNheTam.addEventListener('click', function() {
                toggleButton(this,
                    () => nheTamOn,
                    '🌀 NHẸ TÂM ✓', '🌀 NHẸ TÂM'
                );
            });

            // ----- Xử lý nút 3 (Kích hoạt) -----
            btnKichHoat.addEventListener('click', function() {
                if (this.disabled) return;
                // Chỉ bật nếu chưa bật, và đủ điều kiện
                if (!kichHoatOn && aimlockOn && nheTamOn) {
                    kichHoatOn = true;
                    this.dataset.active = 'true';
                    this.classList.add('active');
                    this.textContent = '⚡ ĐÃ KÍCH HOẠT';
                    statusDisplay.textContent = '✅ KÍCH HOẠT THÀNH CÔNG — HIỆU ỨNG KÍCH HOẠT ĐÃ BẬT';
                    // Thêm hiệu ứng flash (đã có trong CSS)
                    // Reset animation bằng cách xoá và thêm lại class
                    this.style.animation = 'none';
                    requestAnimationFrame(() => {
                        this.style.animation = '';
                    });
                } else if (kichHoatOn) {
                    // Nếu đã bật rồi, bấm lại -> tắt
                    kichHoatOn = false;
                    this.dataset.active = 'false';
                    this.classList.remove('active');
                    this.textContent = '⚡ KÍCH HOẠT';
                    statusDisplay.textContent = '◆ ĐÃ TẮT KÍCH HOẠT';
                    updateKichHoatState(); // cập nhật lại text
                }
            });

            // ----- Đăng nhập -----
            function handleLogin() {
                const user = usernameInput.value.trim();
                const pass = passwordInput.value;

                if (user === VALID_USER && pass === VALID_PASS) {
                    // Thành công
                    loginError.textContent = '';
                    // Ẩn login, hiện main với hiệu ứng
                    loginContainer.style.opacity = '0';
                    loginContainer.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        loginContainer.classList.add('hidden');
                        mainPanel.classList.remove('hidden');
                        mainPanel.classList.add('fade-in');
                        // Reset trạng thái các nút về mặc định (tắt)
                        aimlockOn = false;
                        nheTamOn = false;
                        kichHoatOn = false;
                        btnAimlock.dataset.active = 'false';
                        btnAimlock.classList.remove('active');
                        btnAimlock.textContent = '🎯 AIMLOCK';
                        btnNheTam.dataset.active = 'false';
                        btnNheTam.classList.remove('active');
                        btnNheTam.textContent = '🌀 NHẸ TÂM';
                        btnKichHoat.dataset.active = 'false';
                        btnKichHoat.classList.remove('active');
                        btnKichHoat.textContent = '⚡ KÍCH HOẠT';
                        btnKichHoat.disabled = true;
                        statusDisplay.textContent = '◆ TRẠNG THÁI: CHỜ BẬT AIMLOCK + NHẸ TÂM';
                    }, 400);
                } else {
                    loginError.textContent = '❌ Sai tên đăng nhập hoặc mật khẩu.';
                }
            }

            loginBtn.addEventListener('click', handleLogin);
            // Cho phép Enter
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !loginContainer.classList.contains('hidden')) {
                    handleLogin();
                }
            });

            // Mặc định pre-fill đã có, nhưng nếu muốn clear lỗi khi gõ
            usernameInput.addEventListener('input', () => loginError.textContent = '');
            passwordInput.addEventListener('input', () => loginError.textContent = '');

            // Đảm bảo nút 3 disabled lúc đầu
            btnKichHoat.disabled = true;

        })();
    </script>
</body>
</html>
